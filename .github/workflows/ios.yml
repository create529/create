name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p project
          unzip -o "OGIOS - SOURCE FULL.zip" -d project

      - name: Localizar proyecto Xcode
        run: |
          XCODEPROJ=$(find project -name "ThreeOneOSFive.xcodeproj" -type d | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $XCODEPROJ"

      - name: Reparar archivo del proyecto
        run: |
          PBXPROJ="$XCODEPROJ/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: No se encontró project.pbxproj"
            exit 1
          fi

          sed -i '' '1c\
          // !$*UTF8*$!
          ' "$PBXPROJ"

          echo "Archivo project.pbxproj reparado."

      - name: Comprobar proyecto Xcode
        run: |
          xcodebuild -list -project "$XCODEPROJ"

      - name: Compilar aplicación
        run: |
          rm -rf build

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "OGIOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Crear IPA sin firmar
        run: |
          APP=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ningún archivo .app"
            exit 1
          fi

          echo "Aplicación encontrada: $APP"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/

          mkdir -p output
          cd Payload
          zip -r ../output/OGIOS-unsigned.ipa "$(basename "$APP")"

      - name: Subir IPA como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-IPA
          path: output/OGIOS-unsigned.ipa
          if-no-files-found: error
