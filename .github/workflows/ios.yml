name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p project
          unzip -o "OGIOS - SOURCE FULL.zip" -d project

      - name: Localizar proyecto Xcode
        run: |
          XCODEPROJ=$(find project -type d -name "ThreeOneOSFive.xcodeproj" | head -n 1)

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: No se encontró ThreeOneOSFive.xcodeproj"
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

          echo "Proyecto encontrado:"
          echo "$XCODEPROJ"

      - name: Reparar project.pbxproj
        run: |
          PBXPROJ="$XCODEPROJ/project.pbxproj"

          if [ ! -f "$PBXPROJ" ]; then
            echo "ERROR: No existe:"
            echo "$PBXPROJ"
            exit 1
          fi

          echo "======================================"
          echo "ARCHIVO ENCONTRADO"
          echo "======================================"

          ls -lh "$PBXPROJ"

          echo ""
          echo "======================================"
          echo "PRIMERAS 20 LINEAS"
          echo "======================================"

          sed -n '1,20p' "$PBXPROJ"

          echo ""
          echo "======================================"
          echo "ELIMINANDO BOM"
          echo "======================================"

          perl -pi -e 's/^\x{FEFF}//' "$PBXPROJ"

          echo ""
          echo "======================================"
          echo "CORRIGIENDO SALTOS DE LINEA"
          echo "======================================"

          perl -pi -e 's/\r\n/\n/g; s/\r/\n/g' "$PBXPROJ"

          echo ""
          echo "======================================"
          echo "COMPROBANDO CABECERA"
          echo "======================================"

          FIRST_LINE=$(head -n 1 "$PBXPROJ")

          echo "Cabecera actual:"
          printf '%s\n' "$FIRST_LINE"

          if [ "$FIRST_LINE" != "// !$*UTF8*$!" ]; then

            echo "Cabecera incorrecta."
            echo "Corrigiendo..."

            TEMP_FILE=$(mktemp)

            printf '%s\n' '// !$*UTF8*$!' > "$TEMP_FILE"
            tail -n +2 "$PBXPROJ" >> "$TEMP_FILE"

            mv "$TEMP_FILE" "$PBXPROJ"

            echo "Cabecera corregida."

          else

            echo "Cabecera correcta."

          fi

          echo ""
          echo "======================================"
          echo "BUSCANDO CONFLICTOS DE GIT"
          echo "======================================"

          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' "$PBXPROJ"; then
            echo ""
            echo "ERROR: El proyecto contiene conflictos de Git."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "PRIMERAS 5 LINEAS DESPUES DE REPARAR"
          echo "======================================"

          sed -n '1,5p' "$PBXPROJ"

      - name: Comprobar proyecto Xcode
        run: |
          echo "======================================"
          echo "XCODEBUILD - LIST"
          echo "======================================"

          xcodebuild \
            -list \
            -project "$XCODEPROJ"

      - name: Compilar aplicación
        run: |
          rm -rf build

          echo "======================================"
          echo "COMPILANDO"
          echo "======================================"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "OGIOS" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Buscar aplicación
        run: |
          APP=$(find build/DerivedData/Build/Products -name "*.app" -type d | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No se encontró ningún .app"
            exit 1
          fi

          echo "Aplicación encontrada:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Crear IPA
        run: |
          rm -rf Payload
          mkdir Payload

          cp -R "$APP" Payload/

          mkdir -p output

          cd Payload

          zip -r "../output/OGIOS-unsigned.ipa" "$(basename "$APP")"

          cd ..

          echo "======================================"
          echo "IPA CREADA"
          echo "======================================"

          ls -lh output/OGIOS-unsigned.ipa

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-IPA
          path: output/OGIOS-unsigned.ipa
          if-no-files-found: error
